name: Publish preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trackly-main-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  deploy-database:
    name: Deploy Supabase migrations
    needs: validate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Supabase secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] ||
            [ -z "$SUPABASE_DB_PASSWORD" ] ||
            [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID to GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy migrations
        run: supabase db push --yes --remote

  deploy-backend:
    name: Deploy backend to Railway
    needs: deploy-database
    runs-on: ubuntu-latest
    env:
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Railway configuration
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Add RAILWAY_TOKEN as a GitHub Actions secret and RAILWAY_SERVICE_ID as a repository variable."
            exit 1
          fi

      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL https://railway.com/install.sh)
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy backend
        run: >-
          railway up ./backend
          --path-as-root
          --service "$RAILWAY_SERVICE_ID"
          --message "main ${GITHUB_SHA::7}"
          --ci

  publish:
    name: Publish Expo update
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to the repository's GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish preview update
        run: >-
          eas update
          --channel preview
          --message "main ${GITHUB_SHA::7}"
          --environment preview
          --non-interactive
